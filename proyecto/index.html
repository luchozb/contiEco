<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContiEco - Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-white text-slate-800 flex flex-col justify-between p-6 shadow-2xl">

  <div class="mt-8 text-center">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-3xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
      <i class="fa-solid fa-recycle"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">contiEco</h1>
    <p class="text-slate-500 text-xs mt-1">Transformando tus residuos en impacto positivo</p>
  </div>

  <div class="my-auto space-y-4">
    <div class="flex bg-slate-100 p-1 rounded-2xl">
      <button id="btn-tab-login" onclick="switchTab('login')" class="w-1/2 py-2.5 text-xs font-bold rounded-xl bg-white text-slate-800 shadow-sm transition">Iniciar Sesión</button>
      <button id="btn-tab-register" onclick="switchTab('register')" class="w-1/2 py-2.5 text-xs font-bold rounded-xl text-slate-500 transition">Crear Cuenta</button>
    </div>

    <!-- FORMULARIO LOGIN -->
    <form id="form-login" class="space-y-3">
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase">Correo Electrónico</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
          <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-emerald-500 font-medium" placeholder="tu@correo.com">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase">Contraseña</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
          <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-emerald-500 font-medium" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/30 transition text-sm active:scale-95">
        Ingresar a ContiEco
      </button>
    </form>

    <!-- FORMULARIO REGISTRO -->
    <form id="form-register" class="space-y-3 hidden">
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase">Nombre Completo</label>
        <div class="relative">
          <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
          <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-emerald-500 font-medium" placeholder="Ej. Maya Sandoval">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase">Correo Electrónico</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
          <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-emerald-500 font-medium" placeholder="tu@correo.com">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase">Contraseña (Mínimo 6 caracteres)</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
          <input type="password" id="reg-password" minlength="6" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-emerald-500 font-medium" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/30 transition text-sm active:scale-95">
        Crear Cuenta Nueva (+100 EcoPts)
      </button>
    </form>
  </div>

  <p class="text-center text-[11px] text-slate-400 pb-2">ContiEco © 2026</p>

  <script>
    checkAuth();

    function switchTab(tab) {
      const formLogin = document.getElementById('form-login');
      const formReg = document.getElementById('form-register');
      const btnLogin = document.getElementById('btn-tab-login');
      const btnReg = document.getElementById('btn-tab-register');

      if (tab === 'login') {
        formLogin.classList.remove('hidden');
        formReg.classList.add('hidden');
        btnLogin.className = "w-1/2 py-2.5 text-xs font-bold rounded-xl bg-white text-slate-800 shadow-sm transition";
        btnReg.className = "w-1/2 py-2.5 text-xs font-bold rounded-xl text-slate-500 transition";
      } else {
        formLogin.classList.add('hidden');
        formReg.classList.remove('hidden');
        btnLogin.className = "w-1/2 py-2.5 text-xs font-bold rounded-xl text-slate-500 transition";
        btnReg.className = "w-1/2 py-2.5 text-xs font-bold rounded-xl bg-white text-slate-800 shadow-sm transition";
      }
    }

    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      loginUser(document.getElementById('login-email').value, document.getElementById('login-password').value);
    });

    document.getElementById('form-register').addEventListener('submit', (e) => {
      e.preventDefault();
      registerUser(
        document.getElementById('reg-name').value,
        document.getElementById('reg-email').value,
        document.getElementById('reg-password').value
      );
    });
  </script>
</body>
</html>
